<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RescueOps — Reset Password</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;}
  .glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);}
  .input-field{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid #334155;
    background:#0f172a;color:white;font-size:14px;outline:none;transition:all .2s;}
  .input-field:focus{border-color:#8b5cf6;background:#1e293b;}
  .input-field::placeholder{color:#64748b;}
  .btn{width:100%;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:white;
    font-weight:900;padding:13px;border-radius:12px;font-size:15px;transition:all .2s;border:none;cursor:pointer;}
  .btn:hover{background:linear-gradient(135deg,#6d28d9,#4c1d95);transform:translateY(-1px);}
  .label{display:block;font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .step{display:none;}.step.active{display:block;}
  .pw-wrap{position:relative;}
  .pw-eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#64748b;cursor:pointer;}
  .pw-eye:hover{color:#8b5cf6;}
</style>
</head>
<body class="flex items-center justify-center px-4 py-10">
<div class="w-full max-w-md">
  <a href="/" class="inline-flex items-center gap-2 text-slate-400 hover:text-white text-sm mb-8 transition">
    <i class="fas fa-arrow-left"></i> Back to Home
  </a>

  <div class="glass rounded-3xl p-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-purple-600/20 rounded-2xl mb-4">
        <i class="fas fa-key text-purple-400 text-2xl"></i>
      </div>
      <h1 class="text-2xl font-black text-white">Reset Password</h1>
      <p class="text-slate-400 text-sm mt-1">Answer your security question to reset your password</p>
    </div>

    <div id="msg-box" class="hidden p-3 rounded-xl text-sm font-semibold mb-4 text-center"></div>

    <!-- STEP 1: Choose role + username -->
    <div id="step1" class="step active">
      <div class="mb-4">
        <label class="label">I am a</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" onclick="selectRole('shelter', this)"
                  class="role-btn p-4 rounded-xl border-2 border-slate-700 text-center transition"
                  id="btn-shelter">
            <i class="fas fa-house-chimney text-blue-400 text-xl mb-1 block"></i>
            <span class="text-white text-xs font-bold">Shelter Node</span>
          </button>
          <button type="button" onclick="selectRole('admin', this)"
                  class="role-btn p-4 rounded-xl border-2 border-slate-700 text-center transition"
                  id="btn-admin">
            <i class="fas fa-user-shield text-red-400 text-xl mb-1 block"></i>
            <span class="text-white text-xs font-bold">Admin</span>
          </button>
        </div>
      </div>
      <div class="mb-5">
        <label class="label">Username</label>
        <input id="fp_user" type="text" class="input-field" placeholder="Enter your username">
      </div>
      <button onclick="fetchQuestion()" class="btn">
        <i class="fas fa-search mr-2"></i>Find My Account
      </button>
    </div>

    <!-- STEP 2: Answer + new password -->
    <div id="step2" class="step">
      <div class="mb-4 p-4 bg-purple-900/30 border border-purple-700/40 rounded-xl">
        <p class="text-xs text-purple-300 font-bold mb-1 uppercase">Security Question</p>
        <p class="text-white font-semibold text-sm" id="question-display"></p>
      </div>
      <div class="mb-4">
        <label class="label">Your Answer</label>
        <input id="fp_answer" type="text" class="input-field" placeholder="Type your answer">
      </div>
      <div class="mb-4">
        <label class="label">New Password</label>
        <div class="pw-wrap">
          <input id="fp_newpass" type="password" class="input-field" placeholder="Min 6 characters" style="padding-right:40px">
          <i class="fas fa-eye pw-eye" id="fp-eye" onclick="toggleFpPw()"></i>
        </div>
      </div>
      <div class="mb-5">
        <label class="label">Confirm New Password</label>
        <input id="fp_newpass2" type="password" class="input-field" placeholder="Re-enter new password">
      </div>
      <button onclick="doReset()" class="btn">
        <i class="fas fa-check-circle mr-2"></i>Reset My Password
      </button>
      <button onclick="backToStep1()" class="mt-3 w-full text-slate-400 hover:text-white text-sm font-bold py-2 transition">
        ← Go Back
      </button>
    </div>

    <!-- STEP 3: Success -->
    <div id="step3" class="step text-center py-4">
      <div class="text-6xl mb-4">✅</div>
      <h3 class="text-white font-black text-xl mb-2">Password Reset!</h3>
      <p class="text-slate-400 text-sm mb-6">Your password has been changed successfully. You can now login.</p>
      <div id="login-link"></div>
    </div>
  </div>
</div>

<script>
let selectedRole = '';
const urlRole = new URLSearchParams(window.location.search).get('role') || '';
if (urlRole) { selectRole(urlRole, document.getElementById('btn-' + urlRole)); }

function selectRole(role, btn) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(b => {
    b.classList.remove('border-purple-500','bg-purple-900/30');
    b.classList.add('border-slate-700');
  });
  btn.classList.remove('border-slate-700');
  btn.classList.add('border-purple-500','bg-purple-900/30');
}

function showMsg(msg, ok) {
  const el = document.getElementById('msg-box');
  el.textContent = msg;
  el.className = `p-3 rounded-xl text-sm font-semibold mb-4 text-center ${ok?'bg-green-900/40 text-green-300 border border-green-700':'bg-red-900/40 text-red-300 border border-red-700'}`;
  el.classList.remove('hidden');
}

function showStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step'+n).classList.add('active');
  document.getElementById('msg-box').classList.add('hidden');
}

function backToStep1() { showStep(1); }

async function fetchQuestion() {
  if (!selectedRole) { showMsg('⚠️ Please select Admin or Shelter first.', false); return; }
  const user = document.getElementById('fp_user').value.trim();
  if (!user) { showMsg('⚠️ Enter your username.', false); return; }
  const res = await fetch('/api/get_security_question', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ role: selectedRole, username: user })
  });
  const data = await res.json();
  if (data.status === 'success') {
    document.getElementById('question-display').textContent = data.question;
    showStep(2);
  } else { showMsg('❌ ' + data.message, false); }
}

async function doReset() {
  const answer = document.getElementById('fp_answer').value.trim();
  const np = document.getElementById('fp_newpass').value;
  const np2 = document.getElementById('fp_newpass2').value;
  const user = document.getElementById('fp_user').value.trim();
  if (!answer) { showMsg('⚠️ Enter your security answer.', false); return; }
  if (np.length < 6) { showMsg('⚠️ Password must be at least 6 characters.', false); return; }
  if (np !== np2) { showMsg('⚠️ Passwords do not match.', false); return; }
  const res = await fetch('/api/forgot_password', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ role: selectedRole, username: user, answer, new_password: np })
  });
  const data = await res.json();
  if (data.status === 'success') {
    showStep(3);
    const loginUrl = selectedRole === 'admin' ? '/admin/login' : '/shelter/login';
    document.getElementById('login-link').innerHTML =
      `<a href="${loginUrl}" class="inline-block bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 py-3 rounded-xl transition">Go to Login →</a>`;
  } else { showMsg('❌ ' + data.message, false); }
}

function toggleFpPw() {
  const inp = document.getElementById('fp_newpass');
  const ico = document.getElementById('fp-eye');
  if(inp.type==='password'){inp.type='text';ico.classList.replace('fa-eye','fa-eye-slash');}
  else{inp.type='password';ico.classList.replace('fa-eye-slash','fa-eye');}
}
</script>
</body>
</html>
