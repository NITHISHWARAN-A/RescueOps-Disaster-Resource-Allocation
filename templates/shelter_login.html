<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RescueOps — Shelter Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body{background:linear-gradient(135deg,#0c1a3a 0%,#1a3a5c 50%,#0c1a3a 100%);min-height:100vh;}
  .glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);}
  .input-field{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #1e3a5f;
    background:#0c1a3a;color:white;font-size:14px;outline:none;transition:all .2s;}
  .input-field:focus{border-color:#3b82f6;background:#1e3a5f;}
  .input-field::placeholder{color:#64748b;}
  .btn-primary{width:100%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;
    font-weight:900;padding:14px;border-radius:12px;font-size:16px;transition:all .2s;
    border:none;cursor:pointer;}
  .btn-primary:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af);transform:translateY(-1px);
    box-shadow:0 10px 25px rgba(37,99,235,0.35);}
  .label{display:block;font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;
    letter-spacing:.1em;margin-bottom:8px;}
  .err{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);
    color:#fca5a5;padding:12px;border-radius:10px;font-size:13px;display:none;margin-bottom:16px;}
  .pw-wrap{position:relative;}
  .pw-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);
    color:#64748b;cursor:pointer;transition:color .2s;}
  .pw-eye:hover{color:#3b82f6;}
</style>
</head>
<body class="flex items-center justify-center px-4 py-10">

<div class="w-full max-w-md">
  <a href="/" class="inline-flex items-center gap-2 text-slate-400 hover:text-white text-sm mb-8 transition">
    <i class="fas fa-arrow-left"></i> Back to Home
  </a>

  <div class="glass rounded-3xl p-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 rounded-2xl mb-4">
        <i class="fas fa-house-chimney text-blue-400 text-3xl"></i>
      </div>
      <h1 class="text-2xl font-black text-white">Shelter Portal Login</h1>
      <p class="text-slate-400 text-sm mt-1">Login to submit relief requests and track dispatch status</p>
    </div>

    <div id="err-box" class="err"></div>

    <div class="mb-4">
      <label class="label">Shelter Username</label>
      <input id="username" type="text" class="input-field" placeholder="Your registered username"
             onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
    </div>

    <div class="mb-2">
      <label class="label">Password</label>
      <div class="pw-wrap">
        <input id="password" type="password" class="input-field" placeholder="Enter your password"
               style="padding-right:44px" onkeydown="if(event.key==='Enter')doLogin()">
        <i class="fas fa-eye pw-eye" id="eye-icon" onclick="togglePw()"></i>
      </div>
    </div>

    <div class="text-right mb-6">
      <a href="/forgot_password?role=shelter" class="text-xs text-blue-400 hover:text-blue-300 font-bold transition">
        <i class="fas fa-key mr-1"></i>Forgot Password?
      </a>
    </div>

    <button onclick="doLogin()" id="login-btn" class="btn-primary">
      <i class="fas fa-right-to-bracket mr-2"></i>Login to Shelter Portal
    </button>

    <div class="mt-6 pt-6 border-t border-white/10 text-center">
      <p class="text-slate-400 text-sm mb-3">Don't have an account?</p>
      <a href="/shelter/register" class="inline-block border-2 border-blue-500 text-blue-400 hover:bg-blue-600 hover:text-white font-bold px-6 py-2.5 rounded-xl text-sm transition">
        <i class="fas fa-plus-circle mr-2"></i>Register New Shelter Node
      </a>
    </div>
    <p class="text-center text-slate-500 text-xs mt-4">
      Admin? <a href="/admin/login" class="text-red-400 hover:text-red-300 font-bold">Go to Admin Login →</a>
    </p>
  </div>
</div>

<script>
function togglePw() {
  const inp = document.getElementById('password');
  const ico = document.getElementById('eye-icon');
  if (inp.type === 'password') { inp.type='text'; ico.classList.replace('fa-eye','fa-eye-slash'); }
  else { inp.type='password'; ico.classList.replace('fa-eye-slash','fa-eye'); }
}
async function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('err-box');
  const btn = document.getElementById('login-btn');
  err.style.display='none';
  if (!u||!p){err.textContent='⚠️ Please fill in both fields.';err.style.display='block';return;}
  btn.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>Authenticating...';
  btn.disabled=true;
  const res = await fetch('/api/shelter/login',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u,password:p})
  });
  const data = await res.json();
  btn.innerHTML='<i class="fas fa-right-to-bracket mr-2"></i>Login to Shelter Portal';
  btn.disabled=false;
  if(data.status==='success'){btn.innerHTML='<i class="fas fa-check mr-2"></i>Redirecting...';window.location.href=data.redirect;}
  else{err.textContent='❌ '+data.message;err.style.display='block';}
}
</script>
</body>
</html>
